{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "podinfo-secret" -}}
apiVersion: v1
kind: Secret
metadata:
  name: podinfo-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  API_KEY: {{ if $existingSecret }}{{ index $existingSecret.data "API_KEY" | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}