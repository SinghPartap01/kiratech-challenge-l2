apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: {{ .Release.Namespace }}
  labels:
    app: podinfo
spec:
  type: {{ .Values.service.type }}
  selector:
    app: podinfo
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}